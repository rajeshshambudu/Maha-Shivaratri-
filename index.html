<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cosmic Shiva - Lord of Universes</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: radial-gradient(circle at center, #050510 0%, #000 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', sans-serif;
        }

        /* The Universe Background */
        .stars {
            position: absolute;
            width: 200%;
            height: 200%;
            background: transparent url('https://www.transparenttextures.com/patterns/stardust.png') repeat;
            animation: moveStars 100s linear infinite;
            z-index: 0;
        }

        /* The Central Shiva Lingam */
        .shiva-lingam {
            position: relative;
            width: 120px;
            height: 180px;
            background: linear-gradient(145deg, #1a1a1a, #000);
            border-radius: 60px 60px 20px 20px;
            box-shadow: 0 0 50px rgba(0, 150, 255, 0.4), inset 0 0 20px rgba(255,255,255,0.1);
            z-index: 10;
            border-bottom: 15px solid #111;
        }

        /* The Divine Third Eye / Tripundra */
        .shiva-lingam::after {
            content: '';
            position: absolute;
            top: 40px;
            left: 50%;
            transform: translateX(-50%);
            width: 40px;
            height: 2px;
            background: white;
            box-shadow: 0 5px 0 white, 0 10px 0 white, 0 5px 15px cyan;
        }

        /* Rotating Universes (Galaxies) */
        .universe-container {
            position: absolute;
            width: 500px;
            height: 500px;
            animation: rotateControl 20s linear infinite;
            z-index: 5;
        }

        .galaxy {
            position: absolute;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            filter: blur(2px);
            opacity: 0.7;
        }

        /* Generating galaxy positions around the center */
        .g1 { top: 0; left: 50%; background: radial-gradient(circle, #ff00ff, transparent); }
        .g2 { bottom: 0; left: 50%; background: radial-gradient(circle, #00ffff, transparent); }
        .g3 { left: 0; top: 50%; background: radial-gradient(circle, #ffcc00, transparent); }
        .g4 { right: 0; top: 50%; background: radial-gradient(circle, #ff4400, transparent); }

        /* Animations */
        @keyframes rotateControl {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        @keyframes moveStars {
            from { transform: translate(0, 0); }
            to { transform: translate(-50%, -50%); }
        }

        /* Audio Control Text */
        .audio-hint {
            position: absolute;
            bottom: 20px;
            color: rgba(255,255,255,0.5);
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
    </style>
</head>
<body>

    <div class="stars"></div>

    <div class="universe-container">
        <div class="galaxy g1"></div>
        <div class="galaxy g2"></div>
        <div class="galaxy g3"></div>
        <div class="galaxy g4"></div>
    </div>

    <div class="shiva-lingam"></div>

    <div class="audio-hint">Play Shiv Tandav Stotram for the full experience</div>

    <iframe width="0" height="0" src="https://www.youtube.com/embed/sq8yDhlUfUE?autoplay=1&mute=0" frameborder="0" allow="autoplay"></iframe>

</body>
</html>
